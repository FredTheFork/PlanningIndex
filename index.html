    <!-- Structured Data: FAQPage -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What exactly is Foundationary?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Foundationary is a done-for-you service that creates professional business documents tailored to your specific situation. You answer a structured questionnaire about your business, and we generate a complete set of documents including Terms & Conditions, Privacy Policy, Client Agreement, and other operational essentials — all specific to you and UK law."
          }
        },
        {
          "@type": "Question",
          "name": "Is this a legal service? Are you lawyers?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. Foundationary documents are professionally drafted and UK-compliant, but we're not a law firm and don't provide legal advice. Think of us as a structured service that gets your documentation right the first time. If you need legal advice about your specific situation, you should consult a solicitor."
          }
        },
        {
          "@type": "Question",
          "name": "Who is Foundationary for?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Foundationary is built for UK sole traders and micro-businesses who sell services. You should be comfortable working independently, want your documents to sound professional but human, and don't need ongoing subscriptions or endless customisation."
          }
        },
        {
          "@type": "Question",
          "name": "What documents do I actually get?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "The Business Foundations Pack includes 10 tailored documents created from your completed questionnaire, covering legal protection, client communication, positioning, and admin essentials for UK sole traders. This includes a bespoke client contract, Terms and Conditions, GDPR-compliant Privacy Policy, professional bio, elevator pitches, LinkedIn profile copy, branded invoice template, client welcome emails, late payment letters, and service description sheets."
          }
        },
        {
          "@type": "Question",
          "name": "How long does it take?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "From submitting your intake form to receiving your complete package is typically 5 business days. The form itself takes about 20-30 minutes to complete. We don't rush this process — every document is reviewed individually for accuracy and consistency before you receive it."
          }
        },
        {
          "@type": "Question",
          "name": "Why is it £79?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "We've priced Foundationary to be accessible to sole traders, but not so cheap that it suggests the work isn't serious. £79 covers bespoke document generation, individual review for your situation, and ownership of everything you receive. It's not a subscription trap — you pay once and own the work."
          }
        },
        {
          "@type": "Question",
          "name": "Are your documents GDPR-compliant?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Your Privacy Policy is written to meet GDPR requirements for UK sole traders handling customer data. Your other documents follow UK legal standards. However, GDPR compliance isn't just about documents — it's also about how you actually process and store data."
          }
        },
        {
          "@type": "Question",
          "name": "How do I contact support?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Email foundationarybusiness@gmail.com or call +44 7377 203834. We aim to respond to emails within 24 hours. For complex queries, a phone call often works better."
          }
        }
      ]
    }
    </script>
